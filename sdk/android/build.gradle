plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// The SDK supports the New Architecture only. Applying the React Gradle plugin runs library Codegen
// (generates the `NativeRNFingerprintjsProSpec` base class).
apply plugin: 'com.facebook.react'

apply from: 'fingerprint.gradle'

android {
    namespace "com.fingerprintjs.reactnative"

    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // The Fingerprint Android SDK v4 is compiled with Kotlin 2.3.x metadata, which is newer than
        // the Kotlin compiler the host RN/Expo project pins (currently 2.1.x, reads up to 2.2.0).
        // Skipping the metadata version check lets this module read the v4 SDK's classes.
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        abortOnError = false
    }

    sourceSets {
        main {
            // Generated Codegen sources (the `NativeRNFingerprintjsProSpec` base class).
            java.srcDirs += [layout.buildDirectory.dir('generated/source/codegen/java').get().asFile.path]
        }
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://maven.fpregistry.io/releases' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation "com.fingerprint.android:sdk:$fingerprint_native_sdk_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}
