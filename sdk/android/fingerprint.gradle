// TODO(v4): bump to the Android SDK v4 range (e.g. "[4.0.0, 5.0.0)") once it is published to
// maven.fpregistry.io. The Kotlin module is already reshaped to the v4 response contract; the v4 SDK
// also requires Kotlin 2.x / Java 11 / Android API 23+.
ext.fingerprint_native_sdk_version = "[2.17.0, 2.18.0)"

task printFingerprintNativeSDKVersion {
    doLast {
        println "${fingerprint_native_sdk_version}"
    }
}
